{% extends "base.html" %}

{% block content %}
<h1 class="text-4xl font-bold mb-8">
	🌱 Plant Watcher
</h1>
<form action="/plants" method="post" class="bg-white p-4 rounded-xl shadow mb-8">
	<div class="flex gap-2">
		<input required type="text" name="name" placeholder="Place name" class="border p-2 w-full rounded">
		
		<button class="bg-green-600 text-white px-8 rounded">
			Add place
		</button>
	</div>
</form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<h1 class="text-4xl font-bold mb-8">
	🌱 Plant Watcher
</h1>
<form action="/plants" method="post" class="bg-white p-4 rounded-xl shadow mb-8">
	<div class="mb-4">
		<input type="text" name="name" placeholder="Plant name" class="border p-2 w-full rounded">
	</div>

	<div class="mb-4">
		<input type="text" name="watering_range" placeholder="3" class="border p-2 w-full rounded">
	</div>

	<button class="bg-green-600 text-white px-4 py-2 rounded">
		Add plant
	</button>
</form>
<div class="space-y-4">

	{% for plant in plants %}
	{% if edit_id == plant.id %}

	<div class="bg-green-600 p-4 rounded-xl shadow flex justify-between">

		<form method="post" action="/plants/{{ plant.id }}/edit">
			<div>
				Name:
				<input type="text" name="name" value="{{ plant.name }}">
			</div>
			<div>
				Min days before watering:
				<input type="int" name="watering_interval_min" value="{{ plant.watering_interval_min }}">
			</div>
			<div>
				Max days before watering
				<input type="int" name="watering_interval_max" value="{{ plant.watering_interval_max }}">
			</div>

			<button>Save</button>

		</form>
	</div>

	{% else %}

	<div class="bg-white p-4 rounded-xl shadow flex justify-between">
		<h2>{{ plant.name }}</h2>

		<a href="/manage-plants?edit={{ plant.id }}">
			Edit
		</a>
	</div>
	{% endif %}
	{% endfor %}
</div>
{% endblock %}
